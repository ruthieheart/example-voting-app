apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting.fullname" . }}-result
  labels:
    {{- include "voting.labels" . | nindent 4 }}
    app.kubernetes.io/component: result
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      {{- include "voting.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: result
  template:
    metadata:
      labels:
        {{- include "voting.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: result
    spec:
      containers:
        - name: result
          image: "{{ .Values.result.image.repository }}:{{ .Values.result.image.tag }}"
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "voting.fullname" . }}-postgres
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "voting.fullname" . }}-postgres
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "voting.fullname" . }}-postgres
                  key: database
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting.fullname" . }}-result
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  selector:
    {{- include "voting.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: result
  ports:
    - name: http
      port: {{ .Values.result.service.port }}
      targetPort: {{ .Values.result.service.targetPort }}
