apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voting.fullname" . }}-postgres
  labels:
    {{- include "voting.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ .Values.postgresql.password | quote }}
  database: {{ .Values.postgresql.database | quote }}
