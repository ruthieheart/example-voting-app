apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting.fullname" . }}-vote
  labels:
    {{- include "voting.labels" . | nindent 4 }}
    app.kubernetes.io/component: vote
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      {{- include "voting.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vote
  template:
    metadata:
      labels:
        {{- include "voting.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vote
    spec:
      containers:
        - name: vote
          image: "{{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}"
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting.fullname" . }}-vote
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    {{- include "voting.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vote
  ports:
    - name: http
      port: {{ .Values.vote.service.port }}
      targetPort: {{ .Values.vote.service.targetPort }}
