name: Capstone CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-smoke-test:
    name: Run application smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_URL=postgres://postgres:postgres@db/postgres
          DB_CONNECTION_STRING=Server=db;Username=postgres;Password=postgres;
          EOF

      - name: Start application
        run: docker compose up -d --build --wait

      - name: Test voting and results
        shell: bash
        run: |
          set -euo pipefail

          for url in http://localhost:8080 http://localhost:8081; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" >/dev/null; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Application did not respond at $url"
                docker compose logs
                exit 1
              fi

              sleep 2
            done
          done

          curl --fail --silent --show-error \
            -X POST --data "vote=b" http://localhost:8080/ >/dev/null

          for attempt in $(seq 1 30); do
            vote_count=$(docker compose exec -T db \
              psql -U postgres -d postgres -tAc \
              "SELECT COUNT(*) FROM votes WHERE vote = 'b';" \
              | tr -d '[:space:]')

            if [[ "$vote_count" =~ ^[0-9]+$ ]] &&
               [ "$vote_count" -ge 1 ]; then
              echo "Smoke test passed: vote was stored in PostgreSQL."
              exit 0
            fi

            sleep 2
          done

          echo "Submitted vote was not stored in PostgreSQL."
          docker compose logs
          exit 1

      - name: Stop application and remove test data
        if: always()
        run: docker compose down -v

  build-scan-publish:
    needs: integration-smoke-test
    name: Build, scan and publish
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: ./vote
          - service: result
            context: ./result
          - service: worker
            context: ./worker

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: capstone-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: capstone-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/example-voting-app-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/example-voting-app-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
